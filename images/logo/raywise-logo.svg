<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 64" role="img" aria-label="Raywise Technologies">
  <title>Raywise Technologies</title>
  <defs>
    <linearGradient id="rw-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9A14A"/>
      <stop offset="55%" stop-color="#F2E7C8"/>
      <stop offset="100%" stop-color="#C9A14A"/>
    </linearGradient>
    <linearGradient id="rw-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F6FEB"/>
      <stop offset="100%" stop-color="#1655B8"/>
    </linearGradient>
  </defs>
  <!-- Symbol: a stylized "R" formed by an arc and a counter shape, with a kinetic gold ray -->
  <g transform="translate(4,4)">
    <!-- Outer ring -->
    <circle cx="28" cy="28" r="26" fill="none" stroke="#0E0F12" stroke-width="4"/>
    <!-- Inner R counter -->
    <path d="M16 14 L28 14 Q40 14 40 24 Q40 32 32 34 L42 44 L34 44 L24 34 L24 44 L16 44 Z" fill="#0E0F12"/>
    <!-- Gold ray: a chord slicing the ring, evoking "wise" / light -->
    <path d="M2 28 L54 28" stroke="url(#rw-gold)" stroke-width="3" stroke-linecap="round"/>
    <!-- Blue dot accent -->
    <circle cx="50" cy="14" r="3" fill="#1F6FEB"/>
  </g>
  <!-- Wordmark -->
  <g transform="translate(72,0)" font-family="'Fraunces', 'Playfair Display', Georgia, serif" fill="#0E0F12">
    <text x="0" y="40" font-size="28" font-weight="600" letter-spacing="-0.5">Raywise</text>
    <text x="118" y="40" font-size="28" font-weight="400" font-style="italic" fill="#1F6FEB">Technologies</text>
  </g>
</svg>
