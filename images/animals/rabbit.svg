<svg xmlns="http://www.w3.org/2000/svg" id="root" viewBox="0 0 200 200" role="img" aria-label="Rabbit mascot">
  <title>Rabbit mascot</title>
  <g class="rwt-mascot">
    <ellipse cx="100" cy="184" rx="50" ry="10" fill="#0E0F12" opacity="0.08"/>
    <!-- ears -->
    <ellipse cx="78" cy="38" rx="10" ry="32" fill="#F5F4F0"/>
    <ellipse cx="122" cy="38" rx="10" ry="32" fill="#F5F4F0"/>
    <ellipse cx="78" cy="40" rx="5" ry="22" fill="#FF6F5B" opacity="0.6"/>
    <ellipse cx="122" cy="40" rx="5" ry="22" fill="#FF6F5B" opacity="0.6"/>
    <!-- head -->
    <circle cx="100" cy="106" r="50" fill="#F5F4F0"/>
    <!-- body -->
    <ellipse cx="100" cy="158" rx="42" ry="26" fill="#F5F4F0"/>
    <!-- arms -->
    <ellipse cx="74" cy="160" rx="12" ry="20" fill="#F5F4F0" transform="rotate(-12 74 160)"/>
    <ellipse cx="126" cy="160" rx="12" ry="20" fill="#F5F4F0" transform="rotate(12 126 160)"/>
    <!-- carrot in arms -->
    <path d="M86 162 L114 156 L116 162 L88 168 Z" fill="#C9A14A"/>
    <path d="M116 156 L122 150 L120 154 L122 152 L118 156" fill="#1E9E63"/>
    <!-- eyes -->
    <ellipse cx="84" cy="98" rx="5" ry="7" fill="#0E0F12"/>
    <ellipse cx="116" cy="98" rx="5" ry="7" fill="#0E0F12"/>
    <circle cx="85" cy="96" r="2" fill="#FFFFFF"/>
    <circle cx="117" cy="96" r="2" fill="#FFFFFF"/>
    <!-- nose -->
    <path d="M96 110 L104 110 L100 116 Z" fill="#FF6F5B"/>
    <!-- mouth -->
    <path d="M100 116 L100 120 M100 120 Q94 124 90 120 M100 120 Q106 124 110 120" stroke="#0E0F12" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    <!-- whiskers -->
    <path d="M76 116 L60 112 M76 120 L60 122 M124 116 L140 112 M124 120 L140 122" stroke="#0E0F12" stroke-width="1" stroke-linecap="round"/>
    <!-- blush -->
    <circle cx="74" cy="118" r="4" fill="#FF6F5B" opacity="0.5"/>
    <circle cx="126" cy="118" r="4" fill="#FF6F5B" opacity="0.5"/>
    <!-- tail -->
    <circle cx="146" cy="160" r="8" fill="#F5F4F0"/>
    <circle cx="148" cy="158" r="4" fill="#FFE3DD"/>
  </g>
</svg>
