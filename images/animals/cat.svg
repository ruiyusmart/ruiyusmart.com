<svg xmlns="http://www.w3.org/2000/svg" id="root" viewBox="0 0 200 200" role="img" aria-label="Cat mascot">
  <title>Cat mascot</title>
  <g class="rwt-mascot">
    <ellipse cx="100" cy="180" rx="50" ry="10" fill="#0E0F12" opacity="0.08"/>
    <!-- body -->
    <ellipse cx="100" cy="160" rx="38" ry="22" fill="#1F6FEB"/>
    <ellipse cx="100" cy="168" rx="22" ry="10" fill="#F5F4F0" opacity="0.4"/>
    <!-- tail -->
    <path d="M138 150 Q170 130 168 100 Q160 110 145 130 Z" fill="#1F6FEB"/>
    <!-- head -->
    <circle cx="100" cy="100" r="50" fill="#1F6FEB"/>
    <!-- ears -->
    <path d="M62 70 L70 36 L94 64 Z" fill="#1F6FEB"/>
    <path d="M138 70 L130 36 L106 64 Z" fill="#1F6FEB"/>
    <path d="M70 60 L74 46 L86 60 Z" fill="#C9A14A"/>
    <path d="M130 60 L126 46 L114 60 Z" fill="#C9A14A"/>
    <!-- face white -->
    <path d="M76 100 Q100 130 124 100 Q120 122 100 124 Q80 122 76 100 Z" fill="#F5F4F0"/>
    <!-- eyes -->
    <ellipse cx="84" cy="92" rx="4" ry="6" fill="#0E0F12"/>
    <ellipse cx="116" cy="92" rx="4" ry="6" fill="#0E0F12"/>
    <circle cx="84" cy="90" r="1.4" fill="#FFFFFF"/>
    <circle cx="116" cy="90" r="1.4" fill="#FFFFFF"/>
    <!-- nose -->
    <path d="M96 106 L104 106 L100 112 Z" fill="#FF6F5B"/>
    <!-- mouth -->
    <path d="M100 112 L100 116 M100 116 Q94 122 90 118 M100 116 Q106 122 110 118" stroke="#0E0F12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- whiskers -->
    <path d="M68 110 L48 108 M68 114 L48 116 M132 110 L152 108 M132 114 L152 116" stroke="#0E0F12" stroke-width="1.2" stroke-linecap="round"/>
    <!-- blush -->
    <circle cx="74" cy="112" r="3" fill="#FF6F5B" opacity="0.5"/>
    <circle cx="126" cy="112" r="3" fill="#FF6F5B" opacity="0.5"/>
  </g>
</svg>
