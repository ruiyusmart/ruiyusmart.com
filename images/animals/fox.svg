<svg xmlns="http://www.w3.org/2000/svg" id="root" viewBox="0 0 200 200" role="img" aria-label="Fox mascot">
  <title>Fox mascot</title>
  <!-- body -->
  <g class="rwt-mascot">
    <ellipse cx="100" cy="170" rx="58" ry="14" fill="#0E0F12" opacity="0.08"/>
    <!-- tail -->
    <path d="M48 150 Q20 130 26 90 Q40 100 60 120 Z" fill="#FF6F5B"/>
    <path d="M48 150 Q20 130 26 90 Q40 100 60 120 Z" fill="#FFFFFF" opacity="0.4"/>
    <!-- body -->
    <ellipse cx="100" cy="140" rx="50" ry="34" fill="#FF6F5B"/>
    <ellipse cx="100" cy="148" rx="34" ry="20" fill="#F5F4F0"/>
    <!-- head -->
    <path d="M64 80 L78 38 L96 70 L100 70 L104 70 L122 38 L136 80 Q120 110 100 110 Q80 110 64 80 Z" fill="#FF6F5B"/>
    <!-- ear inner -->
    <path d="M82 50 L92 70 L78 60 Z" fill="#1A1C22"/>
    <path d="M118 50 L108 70 L122 60 Z" fill="#1A1C22"/>
    <!-- face white -->
    <path d="M82 78 Q100 110 118 78 Q116 100 100 104 Q84 100 82 78 Z" fill="#F5F4F0"/>
    <!-- eyes -->
    <circle cx="88" cy="78" r="3.5" fill="#0E0F12"/>
    <circle cx="112" cy="78" r="3.5" fill="#0E0F12"/>
    <circle cx="89.5" cy="76.5" r="1" fill="#FFFFFF"/>
    <circle cx="113.5" cy="76.5" r="1" fill="#FFFFFF"/>
    <!-- nose -->
    <ellipse cx="100" cy="90" rx="3.2" ry="2.4" fill="#0E0F12"/>
    <!-- mouth -->
    <path d="M100 94 L96 100 M100 94 L104 100" stroke="#0E0F12" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- cheeks -->
    <circle cx="76" cy="86" r="3" fill="#FF6F5B" opacity="0.6"/>
    <circle cx="124" cy="86" r="3" fill="#FF6F5B" opacity="0.6"/>
  </g>
</svg>
